# =============================================================================
# GRACE Agent 設定ファイル
# =============================================================================
# 読み込み: grace/config.py::ConfigLoader（既定パス config/grace_config.yml）
#   1. このファイル → 2. 環境変数で上書き → 3. GraceConfig(pydantic) で検証
#
# 環境変数での上書き: GRACE_<SECTION>_<KEY>
#   例: GRACE_LLM_MODEL=qwen2.5:7b
#       GRACE_QDRANT_URL=http://qdrant:6333
#   ※ セクション名は先頭の 1 語のみ（GRACE_WEB_SEARCH_* は web.search_* と
#      解釈されるため効かない。web_search の変更はこのファイルで行う）
#
# ここに書かない値は grace/config.py のクラス既定値がそのまま使われる。
# 本ファイルは「既定値を明示して見えるようにする」ことを目的としており、
# 記載値は現行の既定値と一致させてある（差分＝意図的な変更、として読める）。
# -----------------------------------------------------------------------------
# ⚠️ API キーはここに書かない。.env / 環境変数を使うこと。
#    GOOGLE_API_KEY（Embedding）/ SERPAPI_KEY（Web 検索）
#    ※ LLM はローカル（Ollama）実行のため API キーは不要
# =============================================================================

version: "1.0"

# -----------------------------------------------------------------------------
# LLM設定（LLM 用途はすべてローカル LLM = Ollama）
# -----------------------------------------------------------------------------
# 前提: `ollama serve` が起動済みで、下記モデルを `ollama pull` してあること。
#         ollama pull gemma4:e4b
#
#       既定の gemma4-e4b-ctx8k は pull できる公開モデルではなく、e4b から
#       コンテキスト長を広げて作る派生モデル:
#         printf 'FROM gemma4:e4b\nPARAMETER num_ctx 8192\n' > /tmp/Modelfile
#         ollama create gemma4-e4b-ctx8k -f /tmp/Modelfile
#
# ⚠️ デフォルトモデルの実体は config.py::ModelConfig.DEFAULT_MODEL の1箇所。
#    ここの model / light_model / (下記) ollama.llm_model は、その値を
#    「見える化」するためにミラーしてある値であり、変更するときは
#    config.py 側を直し、ここも同じ値に揃えること（本ファイル冒頭の方針どおり）。
# -----------------------------------------------------------------------------
llm:
  provider: "ollama"
  model: "gemma4-e4b-ctx8k"
  # 分類・YES/NO 判定など軽量な用途に使うモデル。
  # ⚠️ ローカル LLM では model と同一にしてある。別モデルにすると pull が
  #    もう 1 本必要になり、呼び出しのたびに VRAM のロード/アンロードが
  #    発生してかえって遅くなる。使い分けたいときだけ変更する。
  light_model: "gemma4-e4b-ctx8k"
  # M-1: 論理層（計画生成・推論・根拠検証・ReAct）に使う上位モデル。
  # ""（空）= model と同じ ＝ 現行挙動。上位へ寄せるときだけ設定する。
  #
  #   heavy_model: "gemma4:26b-a4b-it-q4_K_M"
  #
  # ⚠️ 切り替え前に確認すること:
  #   1. そのモデルを `ollama pull` 済みか
  #   2. VRAM が足りるか（model と交互に呼ばれるとロード/アンロードが繰り返される）
  #   3. 判定系（複雑度推定・意図分類・情報なし判定・RAG適合性）は light_model
  #      側であり、ここでは切り替わらない
  heavy_model: ""
  # 論理層の拡張思考トークン予算。
  # ⚠️ Ollama には拡張思考に相当する機能がないため **無視される**。
  #    Anthropic 版（grace_v2）との設定互換のために残してある。
  heavy_thinking_budget_tokens: 0
  temperature: 0.7
  max_tokens: 4096
  # LLM 1 呼び出しのリクエスト期限（秒）。llm_compat → OllamaClient →
  # openai SDK の httpx.Timeout として **実際に効く**。
  #
  # ⚠️ 0 / 未設定にすると openai SDK の既定（600 秒 × リトライ 2 回 =
  #    最悪 30 分）が効き、実行が止まったように見える。
  # ⚠️ **planner.step_timeout_seconds より必ず短くすること。**
  #    逆転するとステップ側が先に諦め、HTTP だけが生き残って Ollama の
  #    GPU を占有し、後続の呼び出しをさらに遅らせる。
  #    現行の不変条件: llm.timeout(180) < planner.step_timeout_seconds(240)
  #    （backend/tests/test_timeout_budget.py が守る）
  timeout: 180
  # prompt_addendum は業界プロファイル（backend/app/core/verticals.py）が
  # リクエストごとに注入する。ここでは設定しない。

# -----------------------------------------------------------------------------
# Ollama 接続設定
# -----------------------------------------------------------------------------
# base_url は helper_llm が環境変数 OLLAMA_BASE_URL から解決する。
# 既定値のままリモートの Ollama を使う場合のみ .env で上書きすること。
ollama:
  base_url: "http://localhost:11434/v1"
  llm_model: "gemma4-e4b-ctx8k"

# -----------------------------------------------------------------------------
# Embedding設定（検索用途のみ Gemini）
# -----------------------------------------------------------------------------
# ⚠️ LLM をローカル化しても Embedding は Gemini のまま。既存 Qdrant コレクション
#    （3072次元）をそのまま使うための決定であり、変更しないこと。
embedding:
  provider: "gemini"
  model: "gemini-embedding-001"
  # ⚠️ 変更すると既存 Qdrant コレクションと次元が合わず全件再登録が必要
  dimensions: 3072

# -----------------------------------------------------------------------------
# ツール設定
# -----------------------------------------------------------------------------
tools:
  enabled:
    - rag_search
    - web_search
    - reasoning
    - ask_user
  # プロジェクト全体で恒久的に禁止するツール
  # （code_execute はサンドボックス実行のため既定で enabled に含めない opt-in）
  disabled: []

# -----------------------------------------------------------------------------
# Confidence計算設定
# -----------------------------------------------------------------------------
confidence:
  weights:
    search_quality: 0.25
    source_agreement: 0.20
    llm_self_eval: 0.25
    tool_success: 0.15
    query_coverage: 0.15
  thresholds:
    silent: 0.9      # > 0.9: 自動実行
    notify: 0.7      # 0.7-0.9: 通知のみ
    confirm: 0.4     # 0.4-0.7: 確認要求
    # escalate: < 0.4 人間介入必須
  # S1: 根拠妥当性検証（groundedness）を最終 confidence の主成分にする
  groundedness_enabled: true
  groundedness_weight: 0.6    # 支持率（主成分）
  self_eval_weight: 0.25      # 自己評価（従）
  coverage_weight: 0.15       # 網羅度（従）
  search_aux_weight: 0.2      # 検索ベース集約値（補助）
  # M-6: 判定できた claim の割合（decided/total）による支持率の減衰。
  # support_rate は neutral を分母から外すため、「11 claim 中 7 しか判定できず
  # その 7 が全部 supported」でも 1.0 になる。判定率が低いほど割り引く。
  #   damping   = min(1.0, (decided/total) / coverage_target)
  #   effective = support_rate * (1 - strength + strength * damping)
  # strength: 0.0 で従来どおり（減衰なし）
  groundedness_coverage_strength: 0.3
  groundedness_coverage_target: 0.8
  # これ未満なら回答せず聞き返す
  clarification_confidence: 0.3
  calibration_path: "config/calibration.json"

# -----------------------------------------------------------------------------
# 介入設定（HITL）
# -----------------------------------------------------------------------------
intervention:
  default_timeout: 300  # 5分
  auto_proceed_on_timeout: false
  max_clarification_rounds: 3
  # false にすると ask_user 等で標準入力を待たない（Web API / CI 向け）
  interactive: true

# -----------------------------------------------------------------------------
# リプラン設定
# -----------------------------------------------------------------------------
replan:
  max_replans: 3
  confidence_threshold: 0.4
  partial_replan_threshold: 0.6
  cooldown_seconds: 5

# -----------------------------------------------------------------------------
# コスト管理設定
# -----------------------------------------------------------------------------
cost:
  daily_limit_usd: 10.0
  hourly_limit_usd: 2.0
  per_query_limit_usd: 0.50
  warning_threshold: 0.8  # 80%で警告

# -----------------------------------------------------------------------------
# エラーハンドリング設定
# -----------------------------------------------------------------------------
error:
  max_retries: 3
  retry_delay_base: 1.0  # 秒
  retry_delay_max: 30.0
  exponential_backoff: true

# -----------------------------------------------------------------------------
# ログ設定
# -----------------------------------------------------------------------------
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/grace.log"
  max_size_mb: 100
  backup_count: 5

# -----------------------------------------------------------------------------
# Qdrant設定
# -----------------------------------------------------------------------------
qdrant:
  url: "http://localhost:6333"
  collection_name: "customer_support_faq"
  search_limit: 5
  score_threshold: 0.35
  # これ未満なら web_search を動的挿入する
  rag_sufficient_score: 0.7
  # true にすると collection_name 1 つに限定し横断フォールバックを行わない
  restrict_to_collection: false
  # ⚠️ これは「検索する順番」であって「検索する範囲」ではない。
  #    範囲は allowed_collections / excluded_collections で決まる。
  search_priority:
    - "wikipedia_ja"
    - "livedoor"
    - "cc_news"
    - "japanese_text"
  # allowed_collections は業界プロファイルがリクエストごとに注入する。
  # ここで固定するとプロファイル選択が効かなくなるため空のままにする。
  allowed_collections: []
  # 横断フォールバック（スコープ指定なし＝「基本版」タブ）から外すキーワード（部分一致）。
  #
  # 実測（scripts/measure_rag_threshold.py --vertical all）:
  #   in_scope  12 件の Top … 12/12 が gov_* / saas_* / ec_*（業務コレクション）
  #   out_scope  5 件の Top …  5/5 が cc_news_* / fineweb_*（汎用コーパス）
  #   TP フロア 0.6650 < FP シーリング 0.7054 → 閾値では分離できない
  #
  # 重なりを作っているのは検証用に登録した汎用コーパス。cc_news_* はニュース
  # 記事の Q&A なので時事的な質問すべてに中程度にマッチし、株価の質問では
  # 0.7054（一次閾値 0.7 超え）を取って Web 裏取りまで飛ばしてしまう。
  #
  # 検索したい場合はこのリストから外すか、allowed_collections で明示的に
  # 許可するか、rag_search の collection 引数で名指しする。
  excluded_collections:
    - "cc_news"
    - "fineweb"
    - "wikipedia"
    - "livedoor"
    - "japanese_text"

# -----------------------------------------------------------------------------
# Web検索設定
# -----------------------------------------------------------------------------
web_search:
  backend: "serpapi"               # "serpapi" / "duckduckgo" / "google_cse"(非推奨)
  num_results: 5
  language: "ja"
  timeout: 30                      # 秒。下げるとタイムアウト→0件→誤エスカレの連鎖が起きやすい
  max_retries: 3                   # タイムアウト・5xx 時の試行総数
  retry_backoff_seconds: 2.0       # 待機 = backoff × 試行回数（線形）
  fallback_backend: "duckduckgo"   # 主バックエンド失敗/0件時に1度だけ試す代替（""=無効）
  # W-1: 優先ドメイン（ホスト名の接尾辞一致）。**除外ではなく加点**。
  # 一致した結果のスコアを底上げして上位へ並べ替えるだけで、非一致も残す
  # （絞り込むと 0 件化 → 情報なし回答 → 誤エスカレの連鎖を招くため）。
  # 業界プロファイルがリクエストごとに注入するため、ここでは空のままにする。
  preferred_domains: []
  preferred_domain_boost: 0.15
  # APIキーは環境変数を使う（SERPAPI_KEY / GOOGLE_CSE_API_KEY / GOOGLE_CSE_ENGINE_ID）

# -----------------------------------------------------------------------------
# code_execute（サンドボックス Python 実行）設定
# tools.enabled に "code_execute" を足したときのみ有効
# -----------------------------------------------------------------------------
code_execute:
  timeout_seconds: 5
  max_memory_mb: 256
  max_output_chars: 10000
  denied_imports:
    - "subprocess"
    - "socket"
    - "ctypes"
    - "multiprocessing"
    - "urllib"
    - "requests"
    - "http"
    - "ftplib"
    - "shutil"
    - "asyncio"

# -----------------------------------------------------------------------------
# 実行メモリ層（P4）設定
# 実行実績からコレクション優先順位を学習する
# -----------------------------------------------------------------------------
memory:
  enabled: true
  path: "logs/grace_memory.jsonl"
  min_count: 3      # best_collection 採用に必要な実績件数
  min_score: 0.6    # success_rate(平滑化) × mean_confidence の下限

# -----------------------------------------------------------------------------
# Planner設定（二層計画生成）
# -----------------------------------------------------------------------------
planner:
  # この複雑度未満はルールベース計画（LLM 呼び出しなし）
  llm_plan_complexity_threshold: 0.7
  force_llm_plan: false
  # ステップ実行のタイムアウト（秒）。
  # ⚠️ **llm.timeout より必ず長くすること。** reasoning ステップの中身は
  #    LLM 1 呼び出しで、ローカル 9B では 90〜250 秒かかる。ここが短いと
  #    reasoning が構造的に必ずタイムアウトして replan ループへ落ちる。
  #    現行の不変条件: llm.timeout(180) < step_timeout_seconds(240)
  step_timeout_seconds: 240
  llm_plan_max_attempts: 2
  plan_max_output_tokens: 8192
  complexity_temperature: 0.1
  # 複雑度は数値 1 個で足りるが、thinking を出すモデル（qwen3.5 等）は
  # この枠を思考で使い切って本文が空になる。llm_compat が <think> を
  # 剥がす前提で、思考が収まる程度の枠を確保する。
  complexity_max_output_tokens: 512

# -----------------------------------------------------------------------------
# 補助 LLM 判定（1 語だけ返す分類・YES/NO）の有効・無効
# -----------------------------------------------------------------------------
# 対象: 意図分類 / 情報なし判定 / 強調表現の分類 / 空虚な指摘の判定 /
#       ステップ確信度の LLM 評価
#
# ⚠️ これらはいずれも「失敗したらキーワード判定・検索スコアへフォールバック」
#    する補助処理である。クラウドなら誤差だが、**ローカル LLM では 1 件
#    90〜250 秒**かかり、1 リクエストの大半をここで消費する。
#    実測では全件が空応答で捨てられており、純粋な待ち時間だった。
#
#    判定はもともと LLM 失敗時に通る経路（安全側の既定）へ倒れるだけで、
#    壊れはしない。
#
# ⚠️ **本リポジトリはローカル LLM 専用なので既定は false（切）。**
#    実測（gemma4:26b-a4b-it-qat）では補助判定が 8 回以上呼ばれ、その
#    すべてが finish_reason=length の空応答（本文 0 文字）で捨てられて
#    いた。1 件 90〜250 秒なので約 13 分を確実に無駄にしていた計算になる。
#    同じ質問を Anthropic 版（grace_v2）が 63 秒で終えるのに対し、
#    ローカル版が 1 時間 17 分かかった主因である。
#
#    判定精度を優先したい場合や、十分に速い LLM を指している場合だけ
#    true に戻す。
judges:
  enabled: false
  step_confidence_llm: false

# -----------------------------------------------------------------------------
# Executor設定
# -----------------------------------------------------------------------------
executor:
  fallback_chain:
    rag_search: "web_search"
    web_search: "ask_user"
  parallel_search: true
  max_parallel_steps: 4
  # reasoning へ渡す参照情報の上限（0 = 無制限）。
  # リプランのたびに同じ検索結果が積み上がるため、重複除去に加えて上限を設ける
  # （実測: 3 回のリプランで同一の Web 結果 9 件が 4 回ずつ並び 56 件になった）。
  reasoning_max_sources: 20
  # reasoning へ渡す RAG 結果の最低コサイン類似度（Web 検索は尺度が違うため対象外）。
  # 「緩和閾値で採用」された無関係な結果がプロンプト先頭を占めるのを防ぐ。
  # 全件除外になる場合はフィルタを適用しない。
  #
  # ⚠️ RAG 検索側の「採用の下限」も兼ねる。
  #    不変条件: 推論に使えない文書は、出典としても採用しない。
  #
  # 0.64 は実測値（scripts/measure_rag_threshold.py --vertical all）:
  #   in_scope  n=12  最小 0.6650（TP フロア）
  #   out_scope n= 5  最大 0.6190（FP シーリング）
  #   → 中間の 0.64
  #
  # ⚠️ マージンは 0.046。サンプルが少なく暫定値。運用の質問ログで測り直すこと。
  #    測り直しは `--queries-file myqueries.json` で。
  reasoning_min_rag_score: 0.64
  # S3: ハイブリッド ReAct（観測駆動ループ）
  react_enabled: true
  react_complexity_threshold: 0.7
  react_max_iterations: 8
  # RAG 適合性チェック（_evaluate_rag_relevance）のモデル。
  # ""（空）= llm.light_model へ委譲。"claude-sonnet-4-6" と書けば
  # 従来どおり主モデル判定へ巻き戻せる（A/B 用）。
  relevance_check_model: ""
